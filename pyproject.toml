[project]
name = "ml-eng-practice"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.6.0",
    "kagglehub>=1.0.3",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
